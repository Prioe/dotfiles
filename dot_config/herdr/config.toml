onboarding = false

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false
sidebar_width = 32
sidebar_max_width = 40

[ui.toast]
delivery = "herdr"

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "terminal_title_stripped", bold = true }],
  [
    { token = "workspace", dim = true },
    { token = "agent", dim = true, rules = [{ equals = "claude", hide = true }] },
  ],
]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace", "git_status"]]

[[keys.command]]
key = "prefix+i"
type = "popup"
command = "\"$HOME/.local/bin/worktree-agent\" pick"
description = "start an agent on an issue or task in a new worktree"
