onboarding = false

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false
sidebar_width = 32
sidebar_max_width = 40

[ui.toast]
delivery = "herdr"

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "terminal_title_stripped", bold = true }],
  [
    { token = "workspace", dim = true },
    { token = "agent", dim = true, rules = [{ equals = "claude", hide = true }] },
  ],
]

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-automatic-rename.reset"
description = "hand this tab's name back to automatic naming"
